<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{margin:0;background:#07110d;color:#ecfff6;font-family:"Microsoft YaHei",sans-serif}.wrap{padding:40px;width:1200px;box-sizing:border-box}.title{font-size:32px;margin-bottom:28px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.step{height:170px;border:1px solid #2d5d49;border-radius:18px;padding:20px;background:linear-gradient(180deg,#0e281e,#091b14);display:flex;flex-direction:column;justify-content:space-between}.num{font-size:28px;color:#62e6a5}.name{font-size:18px;font-weight:700}.desc{font-size:13px;color:#9fc5b5;line-height:1.6}</style></head><body><div class="wrap"><div class="title">AI 辅助数据分析工作流</div><div class="flow"><div class="step"><span class="num">01</span><b class="name">公开采集</b><span class="desc">Steam、Apple、TapTap、B站公开评论</span></div><div class="step"><span class="num">02</span><b class="name">匿名化</b><span class="desc">移除用户名、头像和链接信息</span></div><div class="step"><span class="num">03</span><b class="name">预分类</b><span class="desc">主题、情绪、严重度与建议动作</span></div><div class="step"><span class="num">04</span><b class="name">人工抽检</b><span class="desc">48 条分层复核，发现系统性偏差</span></div><div class="step"><span class="num">05</span><b class="name">修正与说明</b><span class="desc">保留命中词、置信度和限制</span></div><div class="step"><span class="num">06</span><b class="name">运营输出</b><span class="desc">看板、周报、案例与行动优先级</span></div></div></div></body></html>
